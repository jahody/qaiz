<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgObsidian" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111622" />
      <stop offset="100%" stop-color="#06080E" />
    </linearGradient>
    <linearGradient id="synapseGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="coreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="24" flood-color="#F59E0B" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgObsidian)" stroke="rgba(245, 158, 11, 0.25)" stroke-width="4" />

  <!-- Outer Orbit Dashed Hexagon -->
  <polygon points="256,48 448,160 448,380 256,492 64,380 64,160" fill="none" stroke="#F59E0B" stroke-width="4" stroke-dasharray="14,14" opacity="0.25" />

  <!-- Synapse Core Structure -->
  <g filter="url(#coreGlow)">
    <!-- Inner Crystalline Hexagon -->
    <polygon points="256,112 396,192 396,352 256,432 116,352 116,192" fill="rgba(245, 158, 11, 0.08)" stroke="url(#synapseGold)" stroke-width="12" stroke-linejoin="round" />

    <!-- Neural Conduits / Synapses linking vertices to center -->
    <line x1="256" y1="112" x2="256" y2="230" stroke="#FEF08A" stroke-width="8" stroke-linecap="round" />
    <line x1="396" y1="352" x2="295" y2="290" stroke="#F59E0B" stroke-width="8" stroke-linecap="round" />
    <line x1="116" y1="352" x2="217" y2="290" stroke="#F59E0B" stroke-width="8" stroke-linecap="round" />

    <!-- Vertex Node Beads -->
    <circle cx="256" cy="112" r="14" fill="#FEF08A" />
    <circle cx="396" cy="192" r="12" fill="#F59E0B" />
    <circle cx="396" cy="352" r="14" fill="#F59E0B" />
    <circle cx="256" cy="432" r="12" fill="#D97706" />
    <circle cx="116" cy="352" r="14" fill="#F59E0B" />
    <circle cx="116" cy="192" r="12" fill="#F59E0B" />

    <!-- Radiant Central Intelligence Core -->
    <circle cx="256" cy="272" r="48" fill="url(#synapseGold)" stroke="#FEF08A" stroke-width="4" />
    <circle cx="256" cy="272" r="22" fill="#FEF08A" />
  </g>
</svg>
